      Cook","title":"CEO"},"words":["Thank","you,","Tejas.","Good","afternoon,","everyone,","and","thanks","for","joining","us.","Today","we\u0027re","reporting","revenue","of","$117.2","billion","for","the","December","quarter.","We","set","all-time","revenue","records","in","a","number","of","markets,","including","Canada,","Indonesia,","Mexico,","Spain,","Turkey,","and","Vietnam,","along","with","quarterly","records","in","Brazil","and","India.","As","a","result","of","a","challenging","environment,","our","revenue","was","down","5%","year","over","year.","But","I\u0027m","proud","of","the","way","we","have","navigated","circumstances","seen","and","unforeseen","over","the","past","several","years,","and","I","remain","incredibly","confident","in","our","team,","in","our","mission,","and","in","the","work","we","do","every","day.","Let","me","discuss","the","three","factors","that","impacted","our","revenue","performance","during","the","quarter.","The","first","was","foreign","exchange","headwinds,","which","had","a","nearly","800","basis","point","impact.","On","a","constant","currency","basis,","we","grew","year","over","year","and","would","have","grown","in","the","vast","majority","of","the","markets","we","track.","The","second","factor,","which","we","described","in","a","November","6th","update,","was","COVID-19-related","challenges,","which","significantly","impacted","the","supply","of","iPhone","14","Pro","and","iPhone","14","Pro","Max","and","lasted","through","most","of","December.","Because","of","these","constraints,","we","had","significantly","less","iPhone","14","Pro","and","iPhone","14","Pro","Max","supply","than","we","planned,","causing","ship","times","to","extend","far","beyond","what","we","had","anticipated.","As","we","always","have","every","step","of","the","way","throughout","the","pandemic,","we","continue","to","prioritize","people","and","work","with","our","suppliers","to","ensure","the","health","and","safety","of","every","worker.","Production","is","now","back","where","we","want","it","to","be.","The","third","factor","was","a","challenging","macroeconomic","environment","as","the","world","continues","to","face","unprecedented","circumstances","from","inflation","to","war","in","Eastern","Europe","to","the","enduring","impacts","of","the","pandemic.","And","we","know","that","Apple","is","not","immune","to","it.","But","whatever","conditions","we","face,","our","approach","is","always","the","same.","We","are","thoughtful","and","deliberate.","We","manage","for","the","long","term.","We","adapt","quickly","to","circumstances","outside","our","control","while","delivering","with","excellence","in","the","things","we","can.","We","invest","in","innovation,","in","people,","and","in","the","positive","difference","we","can","make","in","the","world.","And","we","do","it","all","to","provide","our","customers","with","technology","that","will","enrich","their","lives","and","help","unlock","their","full","creative","potential.","It\u0027s","a","wonderful","thing","to","be","a","part","of,","and","it\u0027s","so","rewarding","for","all","of","us","at","Apple","when","we","hear","how","much","our","customers","are","loving","what","we","create.","Let","me","talk","now","about","what","we","saw","across","our","product","categories.","Starting","with","iPhone,","revenue","came","in","at","$65.8","billion","for","the","quarter,","down","8%","year","over","year.","However,","on","a","constant","currency","basis,","iPhone","revenue","was","roughly","flat.","Our","customers","continue","to","rave","about","the","astounding","camera","capabilities","and","unprecedented","battery","life","and","the","groundbreaking","suite","of","health","and","safety","features.","The","iPhone","14","lineup","pushes","the","limits","of","what","users","can","do","with","a","smartphone.","During","the","quarter,","Mac","revenue","came","in","at","$7.7","billion,","which","was","in","line","with","what","we","had","expected.","We","had","a","difficult","compare","because","this","time","last","year","we","had","the","extremely","successful","launch","of","the","redesigned","M1","MacBook","Pros.","We","also","faced","a","challenging","macroeconomic","environment","and","foreign","exchange","headwinds.","We","remain","confident","in","and","focused","on","the","long-term","opportunity","for","Mac.","Just","last","month,","we","introduced","new","MacBook","Pro","models","powered","by","our","latest","developments","in","Apple","silicon,","M2","Pro","and","M2","Max.","These","chips","enable","unprecedented","performance","and","do","so","with","less","energy,","which","is","not","only","good","for","the","environment,","but","gives","the","newest","MacBook","Pro","the","longest","battery","life","ever","in","a","Mac.","We","also","introduced","the","M2-powered","Mac","Mini,","which","will","supercharge","productivity","for","users","of","all","kinds","and","leave","them","stunned","by","just","how","powerful","a","Mac","Mini","can","be.","During","the","quarter,","iPad","revenue","grew","30%","to","a","total","of","$9.4","billion.","The","very","strong","growth","was","due","in","part","to","a","favorable","compare","to","the","December","quarter","a","year","ago","when","we","experienced","significant","supply","constraints.","Customers","continue","to","praise","our","new","lineup","for","its","versatility,","whether","it\u0027s","the","new","iPad","Pro,","now","powered","by","the","M2,","or","the","newly","designed","iPad","10th","generation","with","its","stunning","liquid","retina","display","and","beautiful","colors.","Revenue","for","wearables,","home,","and","accessories","was","$13.5","billion,","which","was","down","8%","year","over","year,","driven","by","foreign","exchange","headwinds","and","a","challenging","macroeconomic","environment.","We","remain","excited","about","the","long-term","opportunity","in","the","category.","As","an","example,","a","few","weeks","ago,